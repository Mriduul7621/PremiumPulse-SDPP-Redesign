name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build bundled web app
        run: npm run build
      - name: Generate Android project and sync assets
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply PremiumPulse Android launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil

          source = Path('public/premium-pulse-app-icon.png')
          if not source.is_file():
              raise FileNotFoundError(f'Missing original PremiumPulse icon: {source}')
          icon = Image.open(source).convert('RGBA')
          # Keep the entire supplied artwork, including any transparent padding.
          for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              directory = Path('android/app/src/main/res') / f'mipmap-{density}'
              directory.mkdir(parents=True, exist_ok=True)
              artwork = icon.copy()
              artwork.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (255, 255, 255, 0))
              canvas.alpha_composite(artwork, ((size - artwork.width) // 2, (size - artwork.height) // 2))
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  canvas.save(directory / name)
          # Capacitor's generated adaptive icon otherwise overrides the PNG icon on Android 8+.
          adaptive = Path('android/app/src/main/res/mipmap-anydpi-v26')
          if adaptive.exists():
              shutil.rmtree(adaptive)
          print('PremiumPulse original artwork applied to Android launcher icons.')
          PY
      - name: Build installable debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PremiumPulse-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
